name: jocomfy-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  staging-backend:
    image: jocomfy-staging-backend:latest
    build:
      context: ../../sms-core-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5100:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}

      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

      RUN_SEED: "false"
      FORCE_SEED: "false"
      DEFAULT_IMPORT_PASSWORD: ${DEFAULT_IMPORT_PASSWORD:?DEFAULT_IMPORT_PASSWORD is required}

      ENABLE_API_DOCS: "false"

      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-500}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}

      PAYSTACK_SECRET_KEY: ""
      PAYSTACK_API_BASE_URL: ${PAYSTACK_API_BASE_URL:-https://api.paystack.co}
      PAYSTACK_CALLBACK_URL: ""

      GOOGLE_CLIENT_ID: ""
      CALENDAR_FEED_SECRET: ${CALENDAR_FEED_SECRET:-}

      ARKESEL_API_KEY: ""
      ARKESEL_SENDER_ID: ""
      META_WA_PHONE_NUMBER_ID: ""
      META_WA_ACCESS_TOKEN: ""
      META_WA_BUSINESS_ACCOUNT_ID: ""

      GMAIL_USER: ""
      GMAIL_APP_PASSWORD: ""

      # SMS-013: login URL embedded in faculty credential emails. Staging
      # mail is intentionally disabled above, so dispatch reports
      # UNCONFIGURED and this value is unused until SMTP is enabled.
      STAFF_PORTAL_URL: ${STAFF_PORTAL_URL:-https://sms-staging.jocomfy.com}

    networks:
      - staging-net

    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging

  staging-management:
    image: jocomfy-staging-management:latest
    build:
      context: ../../sms-core
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_ENV: staging
        BACKEND_URL: http://staging-backend:5000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_ENV: staging
      BACKEND_URL: http://staging-backend:5000
    depends_on:
      staging-backend:
        condition: service_healthy
    networks:
      - staging-net
    mem_limit: 384m
    cpus: 0.75
    logging: *default-logging

  staging-website:
    image: jocomfy-staging-website:latest
    build:
      context: ../../../jocomfy-site
      args:
        NEXT_PUBLIC_SMS_API_URL: /api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        NEXT_PUBLIC_APP_ENV: staging
        SMS_BACKEND_URL: http://staging-backend:5000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SMS_API_URL: /api
      NEXT_PUBLIC_APP_ENV: staging
      SMS_BACKEND_URL: http://staging-backend:5000
    depends_on:
      staging-backend:
        condition: service_healthy
    networks:
      - staging-net
    mem_limit: 384m
    cpus: 0.75
    logging: *default-logging

networks:
  staging-net:
    name: jocomfy-staging-net
    driver: bridge
