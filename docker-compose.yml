# ── Shared: capped Docker logs so pino's stdout stream can never fill the disk ──
# 10MB x 3 files per service. Raise for high-traffic production if you ship
# logs to a collector instead (then replace json-file with your driver).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [sms-net]
    environment:
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sms_db
    # Postgres is intentionally NOT exposed to the host.
    # Backend reaches it privately over the Docker network using:
    #   postgres:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    # ── Production guardrails: tune to your host. Postgres comfortably
    # serves a whole school inside 1g; raise only for large boarding-school
    # volumes. The CPU cap keeps a runaway query from starving the stack.
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  backend:
    build: ./sms-core-backend
    restart: unless-stopped
    networks: [sms-net]
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql://sms_user:${POSTGRES_PASSWORD}@postgres:5432/sms_db?schema=public
      NODE_ENV: production
      PORT: "5000"
      # ── Tunable via .env (defaults kept identical to the old hardcodes) ──
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-5}
      # ── Paystack Digital Collections ──
      # Leave PAYSTACK_SECRET_KEY blank until sandbox credentials are ready.
      # The backend keeps digital-payment routes disabled without it.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_API_BASE_URL: ${PAYSTACK_API_BASE_URL:-https://api.paystack.co}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}
      # -- Google Sign-In for the External School Website (SMS-004) --
      # Leave blank until the website's Google OAuth Client ID is issued.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # -- Class Timetable Calendar Feeds (SMS-010) --
      CALENDAR_FEED_SECRET: ${CALENDAR_FEED_SECRET:-}
      # -- Communication adapters (SMS-012; blank = channel disabled) --
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      ARKESEL_SENDER_ID: ${ARKESEL_SENDER_ID:-}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:-}
      META_WA_ACCESS_TOKEN: ${META_WA_ACCESS_TOKEN:-}
      META_WA_BUSINESS_ACCOUNT_ID: ${META_WA_BUSINESS_ACCOUNT_ID:-}
      # -- Receipt Emails via Gmail SMTP (SMS-006) --
      # Leave blank until the school's Gmail App Password is issued; the
      # mailer stays disabled (skip-and-log) without both values.
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # API docs are disabled by default. When true in production, /api/docs
      # requires an authenticated ADMIN session.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Empty string = no Domain attribute on cookie.
      # DO NOT set this to "localhost" — browsers reject Domain=localhost
      # per RFC 6265. Leave blank for local dev. Set to your real domain
      # (e.g. sms.school.edu.gh) only in production with HTTPS.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Set to "false" when running on plain HTTP (local Docker, staging).
      # Set to "true" only when serving over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Set RUN_SEED=true to populate the database with demo data on first boot.
      # Only takes effect when the _prisma_migrations table shows a fresh DB.
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    # ── Production guardrails: Express + Prisma live comfortably inside 1g.
    # 1.5 CPU shares keep report-generation spikes responsive for users.
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging

  frontend:
    build:
      context: ./sms-core
      args:
        # Bake /api into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: /api
        # Bake the Docker-internal backend URL into Next.js rewrites at build time.
        # Without this, rewrites default to http://localhost:5000, which points
        # back to the frontend container and causes ECONNREFUSED.
        BACKEND_URL: http://backend:5000
    restart: unless-stopped
    networks: [sms-net]
    ports:
      - "3000:3000"
    environment:
      # BACKEND_URL is read by next.config.ts at SERVER RUNTIME (rewrites).
      # This is NOT exposed to the browser — it is a server-side variable only.
      BACKEND_URL: http://backend:5000
      # Repeat here so Next.js standalone server.js can read it at runtime
      # even though the bundle already has /api baked in from the build arg.
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    # ── Production guardrails: standalone Next.js runtime is lean; 512m is
    # ample for SSR of this dashboard. Bump if you add heavy image work.
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

networks:
  sms-net:
    driver: bridge

volumes:
  postgres_data:
