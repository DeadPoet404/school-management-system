name: SMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend - lint, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sms_user
          POSTGRES_PASSWORD: ci_strong_password_123456
          POSTGRES_DB: sms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_user -d sms_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: sms-core-backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sms_user:ci_strong_password_123456@localhost:5432/sms_db?schema=public
      DIRECT_URL: postgresql://sms_user:ci_strong_password_123456@localhost:5432/sms_db?schema=public
      JWT_SECRET: ci-jwt-secret-that-is-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-thirty-two-characters
      COOKIE_SECRET: ci-cookie-secret-that-is-at-least-thirty-two-characters
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      COOKIE_DOMAIN: ""
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX_REQUESTS: "1000"
      AUTH_RATE_LIMIT_MAX_REQUESTS: "1000"
      ENABLE_API_DOCS: "false"
      RUN_SEED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sms-core-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Lint backend
        run: npm run lint

      - name: Build backend
        run: npm run build

      - name: Test backend
        run: npm run test

      - name: Test backend with coverage
        run: npm run test:coverage

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: sms-core-backend/coverage/
          if-no-files-found: ignore

  frontend:
    name: Management frontend - lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sms-core

    env:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://localhost:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sms-core/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose-config:
    name: Docker Compose config validation
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://sms_user:ci_strong_password_123456@postgres:5432/sms_db?schema=public
      DIRECT_URL: postgresql://sms_user:ci_strong_password_123456@postgres:5432/sms_db?schema=public
      JWT_SECRET: ci-jwt-secret-that-is-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-thirty-two-characters
      COOKIE_SECRET: ci-cookie-secret-that-is-at-least-thirty-two-characters
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      COOKIE_DOMAIN: ""
      CORS_ORIGINS: http://localhost:3000
      RUN_SEED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose config --quiet

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - compose-config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sms-backend-ci ./sms-core-backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg BACKEND_URL=http://backend:5000 \
            -t sms-frontend-ci \
            ./sms-core
